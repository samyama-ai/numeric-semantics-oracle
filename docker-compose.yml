# Engines for the cross-engine numeric oracle. All free, all local, no cloud.
# Non-default ports to avoid colliding with anything already on the box.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: oracle
      POSTGRES_DB: numeric
    ports: ["55432:5432"]
    command: ["postgres", "-c", "max_parallel_workers_per_gather=2"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d numeric"]
      interval: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: oracle
      MYSQL_DATABASE: numeric
    ports: ["53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-poracle"]
      interval: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_PASSWORD: oracle
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["58123:8123"]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 3s
      retries: 20
